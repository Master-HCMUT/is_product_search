[project]
name = "is-product-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.11"
dependencies = [
    "altair>=5.5.0",
    "ipykernel>=6.29.5",
    "llama-index>=0.12.5",
    "llama-index-llms-openai>=0.3.8",
    "loguru>=0.7.3",
    "nbformat>=5.10.4",
    "pydantic-settings>=2.6.1",
    "pymongo>=4.10.1",
    "superlinked-server>=0.7.0",
    "superlinked==17.1.0",
    "zstandard>=0.23.0",
    "sqlalchemy>=2.0.36",
    "matplotlib>=3.9.3",
    "streamlit>=1.41.0",
    "instructor==1.5.2",
    "sentence-transformers==3.3.1",
    "fastapi>=0.115.14",
    "uvicorn>=0.32.1",
    "qdrant-client>=1.12.1",
    "langchain>=1.3.0",
    "langchain-google-genai>=4.2.2",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "httpx>=0.28.1",
    "transformers>=4.57.6",
    "open-clip-torch>=2.29.0",
    "pillow>=12.2.0",
    "torch>=2.12.0",
    "python-multipart>=0.0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
